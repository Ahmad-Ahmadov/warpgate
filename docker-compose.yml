# Warpgate — from a clean checkout:
#
#     cp .env.example .env        # then set WARPGATE_ADMIN_PASSWORD in it
#     docker compose up
#
# That builds the image from this working tree, runs first-time setup if there
# is no config yet, and starts the gateway.
#
#   admin UI   https://localhost:8888/@warpgate/admin
#   portal     https://localhost:8888/@warpgate
#   SSH        localhost:2222
#   MySQL      localhost:33306
#
# The certificate is self-signed on first run, so the browser will warn once.
#
# ── Why there are two services ───────────────────────────────────────────────
# The runtime image is Google Distroless (upstream #2705, which removed 60+
# CVEs in OS packages Warpgate never used). Distroless has no shell, so
# first-run logic cannot be a script in the container's entrypoint any more —
# there is no /bin/sh to run it.
#
# Instead the "only once" decision lives in Warpgate itself. `setup` is a
# one-shot service running `warpgate unattended-setup --if-config-exists=skip`:
# with no config it writes one; with a config it logs "skipping setup" and exits
# successfully. `warpgate` starts only after `setup` has completed successfully.
# Every `docker compose up` runs setup, and every run after the first is a
# no-op.
#
# ── First run ────────────────────────────────────────────────────────────────
# WARPGATE_ADMIN_PASSWORD must be set (in .env, or exported) for the FIRST run
# only. If it is missing, setup exits with Warpgate's own error and the gateway
# does not start. Once ./data holds a config, the variable is not read again
# and can be removed from .env.
#
# It is passed through by name (`- WARPGATE_ADMIN_PASSWORD`), not as
# `${WARPGATE_ADMIN_PASSWORD:-}`. The difference matters: the second form hands
# the container an EMPTY string when the variable is unset, and setup would
# create the admin account with an empty password. A name-only entry leaves an
# unset variable unset, so setup refuses instead.
#
# Config and state live in ./data. Delete that directory to start over.
#
# ── Deploying somewhere other than your laptop ───────────────────────────────
# `external_host` is left unset by setup, which is the safe default: session
# cookies are then scoped to whatever host you browse to, so the gateway works
# at localhost, at a hostname and at an IP alike. Set it when you serve HTTP
# targets, whose URLs are built from it — edit data/warpgate.yaml:
#
#     external_host: gateway.example.com
#
# and `docker compose restart warpgate`. It must be exactly the host in your
# users' address bar, or the browser drops every session cookie.
#
# (This used to be a WARPGATE_EXTERNAL_HOST variable. Without a shell there is
# no way to pass `--external-host` only when the variable is set, and passing it
# empty stores an empty value that Warpgate then warns about on every start.)
#
# ── ./data ownership on Linux hosts ──────────────────────────────────────────
# The container runs as uid 1000. Docker creates a missing ./data as root, which
# uid 1000 cannot write to; setup then fails with a permission error. Either:
#
#     sudo mkdir -p data && sudo chown 1000:1000 data
#
# or rebuild for your own uid:
#
#     docker compose build --build-arg USER_ID=$(id -u)
#
# Docker Desktop's file sharing hides this, so it only bites on Linux.
#
# ── Running other Warpgate commands ──────────────────────────────────────────
# The image's entrypoint is `warpgate`, so subcommands pass straight through:
#
#     docker compose run --rm --no-deps warpgate check
#     docker compose run --rm --no-deps warpgate recover-access
#     docker compose run --rm --no-deps warpgate setup      # interactive
#
# `--no-deps` skips the setup service, which is what you want for these.
#
# ── Reviewing UI changes ─────────────────────────────────────────────────────
# This file does a release build, so a Svelte edit means rebuilding the image.
# For screen-by-screen review use docker/docker-compose.dev.yml instead, where
# a frontend rebuild takes seconds and needs no restart.

name: warpgate

services:
    setup:
        image: warpgate:local
        # Built by the `warpgate` service below; compose builds every image
        # before it starts any container, so this one is already there.
        pull_policy: never
        command:
            - unattended-setup
            - --data-path=/data
            - --http-port=8888
            - --ssh-port=2222
            - --mysql-port=33306
            - --record-sessions
            - --if-config-exists=skip
        environment:
            # Name only: an unset variable stays unset. See "First run" above
            # for why `${WARPGATE_ADMIN_PASSWORD:-}` would be a security bug.
            - WARPGATE_ADMIN_PASSWORD
        volumes:
            - ./data:/data
        restart: 'no'

    warpgate:
        build:
            context: .
            dockerfile: docker/Dockerfile
            args:
                # Fat LTO on the final binary needs more memory than a default
                # Docker Desktop VM has (it takes half the host's RAM, so 7.6
                # GB on a 16 GB machine) and the build is SIGKILLed partway
                # through the last crate. This profile is defined in
                # Cargo.toml, inherits `release` and only turns LTO off.
                #
                # For a full-LTO build, give the VM ~12 GB (Docker Desktop >
                # Settings > Resources) and run:
                #     CARGO_PROFILE=release docker compose build
                CARGO_PROFILE: ${CARGO_PROFILE:-release-no-lto}
        image: warpgate:local
        depends_on:
            setup:
                condition: service_completed_successfully
        ports:
            - '8888:8888'
            - '2222:2222'
            - '33306:33306'
        volumes:
            - ./data:/data
        stdin_open: true
        tty: true
        restart: unless-stopped
